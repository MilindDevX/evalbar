name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # Dogfood the gate on the offline quickstart (mock LLM responses, no API key):
  # a change that lowers any score below the committed baseline fails this job.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: evalbar run examples/quickstart/eval.py --out runs/head.json --quiet
      - name: Compare with baseline
        run: |
          evalbar diff examples/quickstart/baseline.json runs/head.json \
            --fail-on-drop 0 --format markdown >> "$GITHUB_STEP_SUMMARY"
